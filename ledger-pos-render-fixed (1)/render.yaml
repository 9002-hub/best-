services:
  - type: web
    name: ledger-pos
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:setup
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-pos-db
          property: connectionString

databases:
  - name: ledger-pos-db
    plan: free
